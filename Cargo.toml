[package]
name = "linux-uuremote"
version = "0.1.0"
edition = "2021"
description = "独立的 UU 远程 Linux 被控端：按逆向得到的行为重写，不是别人的 fork 分支"
license = "MIT"

[[bin]]
name = "uu-capture-probe"
path = "src/main.rs"

[dependencies]
x11rb = { version = "0.14", features = ["damage", "shm", "xfixes"] }
libc = "0.2"
