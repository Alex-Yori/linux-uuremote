[package]
name = "linux-uuremote"
version = "0.1.0"
edition = "2021"
description = "独立的 UU 远程 Linux 被控端：按逆向得到的行为重写，不是别人的 fork 分支"
license = "MIT"

[[bin]]
name = "uu-capture-probe"
path = "src/main.rs"

[[bin]]
name = "uu-login"
path = "src/bin/uu-login.rs"

[[bin]]
name = "uu-cloud-probe"
path = "src/bin/uu-cloud-probe.rs"

[[bin]]
name = "uuremote-host"
path = "src/bin/uuremote-host.rs"

[[bin]]
name = "uu-selftest"
path = "src/bin/uu-selftest.rs"

[[bin]]
name = "uu-devices"
path = "src/bin/uu-devices.rs" 

[dependencies]
x11rb = { version = "0.14", features = ["damage", "shm", "xfixes", "xtest"] }
libc = "0.2"
# 连接侧协议栈与参照实现同一套（全 rustls，不引系统 OpenSSL）
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync", "io-util"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
bytes = "1"
qrcode = { version = "0.14", default-features = false }
flate2 = "1"
openh264 = "0.9"
webrtc = "0.10"
